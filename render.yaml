services:
  - type: web
    name: irops-copilot-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: CONTEXT_DEV_API_KEY
        sync: false
      - key: TOOL_SHARED_SECRET
        sync: false
      - key: FETCH_TIMEOUT_MS
        value: "12000"
      # Enrichment only — must stay well under FETCH_TIMEOUT_MS so a slow
      # ADS-B lookup can never cost us the schedule answer.
      - key: ADSB_TIMEOUT_MS
        value: "6000"
      # Background advisory re-warm. Bounds how stale a served cache hit can be.
      - key: CACHE_REFRESH_MS
        value: "300000"
